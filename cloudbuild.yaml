steps:
  # 1. Build the Python Docker container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/garbage-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/garbage-backend:latest'
      - '.'

  # 2. Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/garbage-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/garbage-backend:latest'

  # 3. Deploy container directly to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'garbage-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/garbage-backend:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'FIREBASE_DATABASE_URL=https://garbage-fa1b3-default-rtdb.firebaseio.com,FIREBASE_STORAGE_BUCKET=garbage-fa1b3.firebasestorage.app'

images:
  - 'gcr.io/$PROJECT_ID/garbage-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/garbage-backend:latest'
